<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Event Manager Pro · Pray and Move Generation</title>
<script>
/* Event Manager Pro v6.1 (v6.5 : sans boucle) : un lien d'inscription lisible (…/gala-de-noel/inscription) ouvre la page d'inscription de l'application.
   Toute autre adresse inconnue ramène à l'application. */
(function () {
  var p = location.pathname, m = /^(.*?\/)([a-z0-9-]{3,60})\/inscription\/?$/i.exec(p);
  var to = m ? m[1] + '?inscription=' + m[2].toLowerCase() + location.hash : p.replace(/^(\/[^\/]+\/).*$/, '$1');
  // v6.5 : jamais vers la même adresse (sinon la page se rechargerait sans fin, par exemple à la racine d'un domaine)
  if (to === p) to = '/';
  location.replace(to);
})();
</script>
</head>
<body style="font-family:system-ui,sans-serif;text-align:center;padding-top:60px;color:#0A1230">
<p>Ouverture de la page d'inscription…</p>
</body>
</html>
